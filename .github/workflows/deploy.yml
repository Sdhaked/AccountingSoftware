name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: accounting_software
          MYSQL_USER: accounting_user
          MYSQL_PASSWORD: accounting_password
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, bcmath, ctype, fileinfo, json, openssl, pdo, pdo_mysql, tokenizer, xml, gd, zip
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate
        env:
          APP_ENV: testing
          APP_DEBUG: false
          APP_URL: http://localhost
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: accounting_software
          DB_USERNAME: accounting_user
          DB_PASSWORD: accounting_password
          SESSION_DRIVER: database
          CACHE_STORE: database
          QUEUE_CONNECTION: database

      - name: Run database migrations
        run: php artisan migrate --force
        env:
          APP_ENV: testing
          APP_DEBUG: false
          APP_URL: http://localhost
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: accounting_software
          DB_USERNAME: accounting_user
          DB_PASSWORD: accounting_password
          SESSION_DRIVER: database
          CACHE_STORE: database
          QUEUE_CONNECTION: database

      - name: Run test suite
        run: php artisan test
        env:
          APP_ENV: testing
          APP_DEBUG: false
          APP_URL: http://localhost
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: accounting_software
          DB_USERNAME: accounting_user
          DB_PASSWORD: accounting_password
          SESSION_DRIVER: database
          CACHE_STORE: database
          QUEUE_CONNECTION: database

      - name: Build frontend assets
        run: npm run build
